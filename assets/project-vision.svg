<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="440" height="230" role="img" aria-label="Vision Lab: Real-time PPE compliance · MRI tumour segmentation">
<title>Vision Lab</title>
<defs>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262d"/></pattern>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#FF7B72" stop-opacity="0"/><stop offset=".5" stop-color="#FF7B72"/><stop offset="1" stop-color="#FF7B72" stop-opacity="0"/></linearGradient>
</defs>
<style>
