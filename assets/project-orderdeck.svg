<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="440" height="230" role="img" aria-label="OrderDeck: Order management SaaS">
<title>OrderDeck</title>
<defs>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262d"/></pattern>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#BC8CFF" stop-opacity="0"/><stop offset=".5" stop-color="#BC8CFF"/><stop offset="1" stop-color="#BC8CFF" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .mono { font: 12px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; fill: #e6edf3; }
  .sans { font: 600 20px "Segoe UI", Ubuntu, "Helvetica Neue", sans-serif; fill: #e6edf3; }
  .dim { fill: #7d8590; }
  .flow { stroke-dasharray: 3 3; animation: flow 1s linear infinite; }
  .blink { animation: blink 2s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -6; } }
  @keyframes blink { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .flow, .blink { animation: none; } }
</style>
